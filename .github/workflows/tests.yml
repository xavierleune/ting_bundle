name: Tests

on:
  push:
    branches:
      - "main"
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - 8.2
          - 8.3
          - 8.4
          - 8.5
        deps:
          - highest
        composer:
          - v2
        # Lowest dependencies predate PHP 8.3+ deprecations, only test them on the minimal PHP version
        include:
          - php: 8.2
            deps: lowest
            composer: v2
    name: Unit tests (PHP ${{ matrix.php }}, composer ${{ matrix.composer }}, ${{ matrix.deps }} dependencies)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          extensions: bcmath, bz2, gettext, mbstring, memcached, mcrypt, mysqli, opcache, pdo_mysql, zip, pdo, intl, json, pdo_pgsql, pgsql, session, simplexml, xml
          tools: "composer:${{ matrix.composer }}, pecl"

      - name: "Install ${{ matrix.deps }} deps with composer"
        uses: "ramsey/composer-install@v3"
        with:
          dependency-versions: "${{ matrix.deps }}"

      - name: Run PHPUnit tests
        run: |
          # PHPUnit notices (e.g. mocks without expectations) only exist since PHPUnit 12
          if php vendor/bin/phpunit --version | grep -qE "PHPUnit (1[2-9]|[2-9][0-9])\."; then
            php vendor/bin/phpunit --fail-on-phpunit-notice
          else
            php vendor/bin/phpunit
          fi
